; FM30 headless controller + RDS encoder (NUCLEO-G431KB)
[env:nucleo_g431kb]
platform = ststm32
board = nucleo_g431kb
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
monitor_eol = LF
build_flags =
    -O2
    -Wall
    -Iinclude
    -DHSE_VALUE=24000000U
    -mcpu=cortex-m4
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard
extra_scripts = pre:fpu_link.py
